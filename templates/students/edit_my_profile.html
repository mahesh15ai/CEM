{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80">
    <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-100">
        <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center text-xl flex-shrink-0">
            <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-900">Edit My Profile</h2>
            <p class="text-xs text-slate-500">Update personal details. Student ID, Academic Info & QR Code are read-only.</p>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Read-Only Notice -->
        <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-3 text-xs text-amber-800 font-medium">
            <i class="fa-solid fa-shield-halved text-amber-600 text-base"></i>
            <span>Your <strong>Student ID</strong> and <strong>QR Code Token</strong> are system-locked for security. Contact Admin for academic corrections.</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Student ID (Locked)</label>
                <input type="text" value="{{ student.student_id }}" disabled class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-100 font-mono text-slate-500 cursor-not-allowed">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Course Program (Locked)</label>
                <input type="text" value="{{ student.course }} ({{ student.year }})" disabled class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">First Name</label>
                <input type="text" name="first_name" value="{{ student.user.first_name }}" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Last Name</label>
                <input type="text" name="last_name" value="{{ student.user.last_name }}" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Date of Birth</label>
            <input type="date" name="dob" value="{{ student.dob|date:'Y-m-d' }}" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Update Photograph</label>
            <input type="file" name="photo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100 cursor-pointer">
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
            <a href="{% url 'student_profile_view' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-2 text-xs">
                <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
