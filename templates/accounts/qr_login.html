{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border border-slate-200 text-center">
    
    <div class="mb-6">
        <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
            <i class="fa-solid fa-qrcode"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Student QR Pass Login</h2>
        <p class="text-xs text-slate-500 mt-1">Scan your Digital ID Pass QR Code to log in instantly</p>
    </div>

    <!-- Camera Box -->
    <div class="relative w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden shadow-inner border-2 border-brand-500 mb-4 flex items-center justify-center">
        <div id="reader" class="w-full h-full"></div>
    </div>

    <!-- Manual Start Button (Pops up browser permission) -->
    <button id="start-cam-btn" onclick="startCamera()" class="mb-4 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow transition">
        <i class="fa-solid fa-camera mr-1"></i> Allow & Open Camera
    </button>

    <div id="scan-status" class="text-xs font-bold text-slate-600 mb-4">
        Click button above to grant camera permission.
    </div>

    <form id="qr-form" method="POST" action="{% url 'qr_login' %}">
        {% csrf_token %}
        <input type="hidden" name="qr_data" id="qr_data_input">
    </form>

    <a href="{% url 'login' %}" class="inline-block text-xs text-slate-500 font-bold hover:text-brand-600 transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Username Login
    </a>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    const statusText = document.getElementById('scan-status');
    const startBtn = document.getElementById('start-cam-btn');
    let html5Qrcode;

    function startCamera() {
        if(!html5Qrcode) {
            html5Qrcode = new Html5Qrcode("reader");
        }
        
        statusText.innerText = "Requesting permission...";

        html5Qrcode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 220, height: 220 } }, 
            (decodedText) => {
                statusText.innerText = "QR Detected! Logging in...";
                document.getElementById('qr_data_input').value = decodedText;
                html5Qrcode.stop().then(() => {
                    document.getElementById('qr-form').submit();
                });
            }
        ).then(() => {
            statusText.innerText = "Camera Active. Scan your QR Pass.";
            startBtn.style.display = 'none'; // Hide button once allowed
        }).catch(err => {
            console.error(err);
            statusText.innerText = "⚠️ Browser blocked camera. Please check Chrome flags or browser site settings.";
        });
    }
</script>
{% endblock %}
